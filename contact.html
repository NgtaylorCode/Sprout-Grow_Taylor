<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register for Event - Sprout & Grow</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <img src="images/sprout-grow-horizontal-524-transparent.png"
             alt="Sprout and Grow Logo"
             class="logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>

                <li class="dropdown">
                    <a href="events.html">Events</a>
                    <ul class="dropdown-content">
                        <li><a href="contact.html">Register for Event</a></li>
                    </ul>
                </li>

                <li><a href="products.html">Products</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>📅 Register for an Event</h1>
    
        <div class="section-divider"></div>
          
        <div class="register-container">

            <!-- FORM SIDE -->
            <form class="register-form">

                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone">

                <label for="event">Select Event</label>
                <select id="event" name="event" required>
                    <option value="">-- Choose an event --</option>
                    <option value="spring">Spring Planting Workshop</option>
                    <option value="indoor">Indoor Gardening Basics</option>
                    <option value="community">Community Garden Day</option>
                </select>

                <label for="message">Additional Notes</label>
                <textarea id="message" name="message" rows="4"
                    placeholder="Anything we should know?"></textarea>

                <button type="submit">Submit Registration</button>
            </form>

            <!-- IMAGE SIDE -->
            <div class="register-image">
                <img src="images/samantha-borges-EeS69TTPQ18-unsplash.jpg"
                     alt="macbook pro on brown wooden table">
            </div>

        </div>
    </main>

    <footer>
        <p>© 2026 Sprout & Grow | Icons via Freepik</p>

        <a href="https://facebook.com" target="_blank">
            <img src="images/10483439.png" alt="Facebook icon">
        </a>

        <a href="https://x.com" target="_blank">
            <img src="images/10483412.png" alt="X social icon">
        </a>
    </footer>
</body>
</html>
